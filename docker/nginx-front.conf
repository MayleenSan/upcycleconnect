server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA React : toute route inconnue renvoie index.html
    # (sinon un rafraîchissement sur /espace ou /login donne un 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les appels /api/... sont relayés vers le conteneur "api" (nom du service compose).
    location /api/ {
        proxy_pass http://api:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
